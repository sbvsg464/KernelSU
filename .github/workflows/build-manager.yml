name: Build Manager
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4   # 升级到 v4，修复 tools 报错

      - name: Install manager SDK packages
        shell: bash
        run: |
          set -o pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          # 改用 Google 当前实际提供的稳定版本
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            platform-tools \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'

      - name: Build manager debug APK
        working-directory: manager
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-manager-debug
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error