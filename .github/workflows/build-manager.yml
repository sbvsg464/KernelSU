name: Build Manager
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1'
      - name: Build manager debug APK
        working-directory: manager
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-manager-debug
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
